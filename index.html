<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080e16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Cazador: Mitos del Paraguay</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;color:#f4e8c8;font-family:system-ui,sans-serif;touch-action:none}
#game{width:100%;height:100%;display:grid;place-items:center}canvas{max-width:100%;max-height:100%;image-rendering:auto}
#hud{position:fixed;inset:12px 14px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #101010;font-weight:800;letter-spacing:.04em}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:#101812cc;border:1px solid #b58b50;padding:9px 14px;border-radius:8px;text-align:center;font-size:13px}
#controls{position:fixed;inset:auto 0 18px;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.ctrl{width:62px;height:62px;border:2px solid #d7bd82;border-radius:16px;background:#26382cdd;color:#fff1c8;font-size:25px;font-weight:900;box-shadow:0 4px #101010;touch-action:none;user-select:none}
.ctrl:active{transform:translateY(3px);box-shadow:0 1px #101010;background:#526343}

#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));gap:8px;z-index:30}
.pad{align-items:flex-end;gap:clamp(6px,1.6vw,14px);min-width:0}.pad.actions{gap:clamp(6px,1.6vw,14px)}
.ctrl{width:clamp(48px,9vh,70px);height:clamp(48px,9vh,70px);min-width:48px;min-height:48px;border-radius:50%;background:#26382cef;border:2px solid #e2ca91;box-shadow:0 5px 0 #11180f;font-size:clamp(25px,4.5vh,34px);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:none;flex:0 0 auto}
.pad.actions .ctrl:first-child{transform:none}
.ctrl:focus{outline:none}.ctrl.is-pressed{transform:translateY(3px);box-shadow:0 1px 0 #11180f;background:#526343}
#rotate{display:none!important}#skipIntro{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:80;padding:10px 15px;border:1px solid #d7bd82;border-radius:999px;background:#101812dd;color:#f4e8c8;font-weight:800;font-size:13px;touch-action:manipulation}#skipIntro:active{transform:scale(.96);background:#526343}
@media(orientation:portrait){#game{width:100vw;height:100dvh}#hud{font-size:12px}#controls{transform:scale(.88);transform-origin:bottom center}}
@media(orientation:landscape) and (max-height:500px){#hud{inset:6px 12px auto;font-size:12px}#hint{top:8%;font-size:11px;padding:6px 9px}#controls{bottom:max(6px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.ctrl{width:clamp(46px,10vh,56px);height:clamp(46px,10vh,56px);min-width:46px;min-height:46px}}
@media(min-width:800px){#controls{opacity:.85}.ctrl{width:58px;height:58px}}
</style>
</head>
<body><div id="game"></div><div id="hud"><span>CAZADOR · MITOS DEL PARAGUAY</span><span id="life">♥ ♥ ♥</span></div><div id="hint">Bosque del Yvyrá · Nivel 1<br>Encuentra y ahuyenta al espíritu del monte</div>
<div id="controls"><div class="pad"><button type="button" class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="pad actions"><button class="ctrl" data-key="jump" aria-label="Saltar">⬆</button><button class="ctrl" data-key="attack" aria-label="Atacar">✦</button><button class="ctrl" data-key="weapon" aria-label="Cambiar arma">⚔</button></div></div>
<button id="skipIntro" type="button">SALTAR INTRODUCCIÓN »</button><div id="levelcomplete" style="display:none;position:fixed;inset:0;z-index:60;background:#080d0bdc;align-items:center;justify-content:center;text-align:center;padding:24px"><div style="background:#1d2b20;border:2px solid #d7bd82;border-radius:18px;padding:26px;max-width:340px;width:100%;box-shadow:0 12px 40px #0009"><div style="font:800 25px Georgia;color:#f4e8c8;margin-bottom:10px">El bosque queda en silencio</div><div style="color:#d9c69d;margin-bottom:20px">Has sobrevivido al primer encuentro. El camino continúa.</div><button id="playAgain" type="button" style="min-height:54px;width:100%;border:2px solid #e2ca91;border-radius:12px;background:#526343;color:white;font-size:17px;font-weight:800">↻ VOLVER A JUGAR</button></div></div><div id="gameover" style="display:none;position:fixed;inset:0;z-index:50;background:#080d0bdc;align-items:center;justify-content:center;text-align:center;padding:24px"><div style="background:#1d2b20;border:2px solid #d7bd82;border-radius:18px;padding:24px;max-width:320px;width:100%;box-shadow:0 12px 40px #0009"><div style="font:800 24px Georgia;color:#f4e8c8;margin-bottom:10px">Has caído en el monte</div><div style="color:#d9c69d;margin-bottom:18px">El camino aún no ha terminado.</div><button id="restart" type="button" style="min-height:54px;width:100%;border:2px solid #e2ca91;border-radius:12px;background:#526343;color:white;font-size:18px;font-weight:800">↻ VOLVER A JUGAR</button></div></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="./intro.js"></script>
<script>
const keys={left:false,right:false,jump:false,attack:false,weapon:false};
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>{try{screen.orientation?.lock?.('landscape')?.catch?.(()=>{});}catch(_){}},{once:true});
// Bloqueo adicional del zoom gestual y del doble toque en Safari/iOS.
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.scale&&e.scale!==1)e.preventDefault()},{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault());
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;let activePointer=null;const on=e=>{e.preventDefault();if(activePointer!==null)return;activePointer=e.pointerId;try{b.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true;b.classList.add('is-pressed');try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape')).catch(()=>{});else screen.orientation?.lock?.('landscape')?.catch?.(()=>{});}catch(_){}};const off=e=>{if(activePointer!==null&&e.pointerId!==activePointer)return;e.preventDefault();keys[k]=false;b.classList.remove('is-pressed');activePointer=null};b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));});
window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('.ctrl').forEach(b=>b.classList.remove('is-pressed'))});
function restartLevel(){document.getElementById('gameover').style.display='none';document.getElementById('levelcomplete').style.display='none';const game=window.cazadorGame;if(game){game.scene.stop('forest');game.scene.start('forest');}}document.getElementById('restart').addEventListener('click',restartLevel);document.getElementById('playAgain').addEventListener('click',restartLevel);
window.addEventListener('gamepadconnected',()=>{const h=document.getElementById('hint');if(h)h.innerHTML='Mando conectado: cruceta o stick para moverte · A/sur para saltar · X/oeste o B/este para disparar';});
function readGamepad(){const pads=navigator.getGamepads?navigator.getGamepads():[];const p=Array.from(pads).find(x=>x&&x.connected);if(!p)return {left:false,right:false,jump:false,attack:false};const ax=p.axes?.[0]||0,b=p.buttons||[];return {left:ax<-.35||!!b[14]?.pressed,right:ax>.35||!!b[15]?.pressed,jump:!!b[0]?.pressed||!!b[12]?.pressed,attack:!!b[2]?.pressed||!!b[1]?.pressed||!!b[3]?.pressed};}
class Forest extends Phaser.Scene{
 constructor(){super('forest');this.hp=3;this.hitWait=0;this.shotWait=0;this.elapsed=0;this.levelLength=38000;this.bossSpawned=false;this.projectiles=[];this.enemies=[];this.loot=[]}
 preload(){this.load.svg('forestBg','./assets/forest.svg',{width:1920,height:540});this.load.svg('hunterSprite','./assets/hunter.svg',{width:96,height:128});this.load.svg('dogSprite','./assets/dog.svg',{width:112,height:72});this.load.svg('aoaoSprite','./assets/aoao.svg',{width:90,height:112});}
 create(){
  this.gameOver=false;this.levelComplete=false;const overlay=document.getElementById('gameover');if(overlay)overlay.style.display='none';const victory=document.getElementById('levelcomplete');if(victory)victory.style.display='none';
  document.getElementById('hud').style.display='flex';document.getElementById('controls').style.display='flex';document.getElementById('hint').style.display='block';document.getElementById('skipIntro').style.display='none';
  this.physics.world.setBounds(0,0,this.levelLength,540);
  // Fondo en segmentos pequeños: evita texturas/canvas gigantes que fallan en GPU móviles.
  // Cada tramo mide como máximo 1920 px y conserva el bosque continuo al desplazarse la cámara.
  for(let x=0;x<this.levelLength;x+=1920){
   const width=Math.min(1920,this.levelLength-x);
   this.add.tileSprite(x+width/2,270,width,540,'forestBg').setDepth(-20);
  }
  // Texturas propias: suelo, protagonista, espíritu, bala y jefe.
  let g=this.make.graphics({x:0,y:0,add:false});g.fillStyle(0x59452b,1);g.fillRect(0,0,64,32);g.fillStyle(0x819052,1);g.fillRect(0,0,64,5);g.generateTexture('groundTile',64,32);g.destroy();
  this.makeHunter();this.makeGhost();this.generatorStats={segments:0,enemies:0,ammo:0,platforms:0};
  this.ground=this.physics.add.staticGroup();for(let x=0;x<this.levelLength;x+=1024){const width=Math.min(1024,this.levelLength-x);const floor=this.ground.create(x+width/2,462,'groundTile');floor.setDisplaySize(width,32).refreshBody();}
  this.player=this.physics.add.sprite(150,370,'hunterSprite').setDisplaySize(56,76).setCollideWorldBounds(true);this.player.body.setSize(28,54).setOffset(10,5);this.playerBaseScaleX=this.player.scaleX;this.playerBaseScaleY=this.player.scaleY;
  this.physics.add.collider(this.player,this.ground);
  this.dog=this.add.container(112,405);this.drawDog(this.dog);
  this.cameras.main.setBounds(0,0,this.levelLength,540);this.cameras.main.startFollow(this.player,true,.08,.08);
  this.cursors=this.input.keyboard.createCursorKeys();this.wasd=this.input.keyboard.addKeys('A,D,W,SPACE,J,K');
  // Generación progresiva: solo crea contenido cerca del jugador para proteger la memoria del móvil.
  this.nextSpawnX=650;
  this.spawnWorldSegment=(x)=>{
   const n=Math.floor(x/560)+20261122;let seed=(n*1664525+1013904223)>>>0;
   const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
   this.generatorStats.segments++;
   if(rnd()>.28){const y=350+Math.floor(rnd()*55);const e=this.physics.add.sprite(x,y,'aoaoSprite').setDisplaySize(54,68).setTint(0xb8c9ae);e.body.setAllowGravity(false);e.setData('hp',2);this.physics.add.overlap(this.player,e,()=>this.touchEnemy(e));e.setVelocityX(rnd()>.5?28:-28);e.setData('seedDirection',Math.sign(e.body.velocity.x));this.enemies.push(e);this.generatorStats.enemies++;}
   if(rnd()>.55){const a=this.physics.add.staticImage(x+220,405,'groundTile');a.setScale(1.8,.35).refreshBody();this.physics.add.collider(this.player,a);this.generatorStats.platforms++;}
   if(rnd()>.52){const item=this.physics.add.staticImage(x+300,405,'groundTile').setTint(0xe8c65a);item.setScale(.35,.35).refreshBody();item.setData('ammo',5);this.physics.add.overlap(this.player,item,()=>{if(item.active){this.ammo+=5;item.destroy();this.updateHud();}});this.loot.push(item);this.generatorStats.ammo++;}
  };
  this.ammo=24;this.weaponIndex=0;this.weapons=[{id:'rifle',name:'ESCOPETA',symbol:'⌁',reach:0,damage:1},{id:'machete',name:'MACHETE',symbol:'⚔',reach:100,damage:3},{id:'rebenque',name:'ARREADOR',symbol:'〰',reach:138,damage:1},{id:'fists',name:'PUÑOS',symbol:'✊',reach:52,damage:1}];this.weaponCooldown=0;this.swingTime=0;this.weaponWasDown=false;this.blessingLevel=0;this.macheteDamageBonus=0;this.blessings=[];this.dogState='FOLLOW';this.dogThink=0;this.dogAttackWait=0;this.dogIdle=0;this.lastPlayerX=this.player.x;this.dogItems=[];this.ambushIndex=0;this.ambushMarks=[4200,11200,20500,29200];this.weaponText=this.add.text(24,62,'',{fontFamily:'monospace',fontSize:'13px',color:'#ffe3a0',backgroundColor:'#18251ddd',padding:{x:8,y:5}}).setScrollFactor(0);this.weaponFx=this.add.graphics();this.dogSignal=this.add.text(0,0,'',{fontFamily:'sans-serif',fontSize:'20px',color:'#ffdf91',stroke:'#101812',strokeThickness:4}).setDepth(1000);// Altares de bendición: recompensan la exploración y mejoran el machete de forma acumulativa.
  for(const x of [7800,17800,27800]){const altar=this.physics.add.staticImage(x,408,'bullet').setTint(0xb79aff).setScale(2.2).refreshBody();altar.setData('blessing',true);this.physics.add.overlap(this.player,altar,()=>{if(altar.active){altar.destroy();this.grantBlessing();}});this.blessings.push(altar);}
  // Ambiente vivo de bajo coste: luciérnagas y bruma tenue en primer plano.
  this.ambient=this.add.container(0,0).setScrollFactor(0).setDepth(450);
  for(let i=0;i<12;i++){const mote=this.add.circle(30+(i*79)%900,110+(i*47)%300,1.5+(i%3)*.6,0xd9d99a,.45);this.ambient.add(mote);this.tweens.add({targets:mote,y:mote.y-18-(i%4)*8,alpha:.12,duration:1800+(i%5)*320,yoyo:true,repeat:-1,delay:i*130,ease:'Sine.easeInOut'});}
  const shade=this.add.graphics().setScrollFactor(0).setDepth(440);shade.fillStyle(0x07100b,.12);shade.fillRect(0,0,960,540);
  this.updateHud();this.updateWeaponHud();
  this.add.text(24,495,'◀ ▶ MOVER   ⬆ SALTAR   ✦ DISPARAR   ·   TECLADO: A/D + ESPACIO + J',{fontFamily:'monospace',fontSize:'13px',color:'#f4e8c8'}).setScrollFactor(0).setAlpha(.95);
  this.add.text(24,38,'MONTE VIVO · ENCUENTROS POR ZONAS',{fontFamily:'monospace',fontSize:'11px',color:'#c6d4a1'}).setScrollFactor(0).setAlpha(.9);
  this.timerText=this.add.text(480,18,'FASE: 00:00 / 03:20',{fontFamily:'monospace',fontSize:'15px',color:'#f4e8c8'}).setOrigin(.5,0).setScrollFactor(0);
  this.ammoText=this.add.text(800,38,'✦ '+this.ammo,{fontFamily:'monospace',fontSize:'14px',color:'#f4e8c8'}).setScrollFactor(0);
 }
 drawDog(c){let a=this.add.image(0,0,'dogSprite').setDisplaySize(58,38);c.add(a);this.tweens.add({targets:a,scaleY:a.scaleY*1.045,duration:460,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});}
 makeHunter(){let g=this.add.graphics();g.fillStyle(0x30251d,1);g.fillRect(12,37,13,23);g.fillRect(28,37,13,23);g.fillStyle(0x4b3426,1);g.fillRect(8,57,20,6);g.fillRect(27,57,20,6);g.fillStyle(0xd9c69b,1);g.fillRect(10,12,33,34);g.fillStyle(0x9e2930,1);g.fillRect(11,12,31,7);g.fillStyle(0x8a6039,1);g.fillRect(10,0,34,8);g.fillRect(4,7,47,5);g.fillStyle(0xd6aa76,1);g.fillRect(20,20,15,14);g.fillStyle(0x30251d,1);g.fillRect(31,25,3,3);g.generateTexture('hunter',56,66);g.destroy();let gh=this.add.graphics();gh.fillStyle(0xc4d4bc,.9);gh.fillEllipse(26,28,42,52);gh.fillStyle(0x1b2923,1);gh.fillCircle(19,24,4);gh.fillCircle(32,24,4);gh.fillStyle(0x9e2930,1);gh.fillEllipse(26,42,15,5);gh.generateTexture('ghost',54,65);gh.destroy();let b=this.make.graphics({x:0,y:0,add:false});b.fillStyle(0xffd36b,1);b.fillRect(0,0,12,5);b.generateTexture('bullet',12,5);b.destroy();let boss=this.make.graphics({x:0,y:0,add:false});boss.fillStyle(0x24251d,1);boss.fillEllipse(55,55,100,100);boss.fillStyle(0xe7c66b,1);boss.fillCircle(38,45,7);boss.fillCircle(70,45,7);boss.fillStyle(0x8b2525,1);boss.fillEllipse(55,76,38,12);boss.generateTexture('boss',110,110);boss.destroy()}
 makeGhost(){}
 updateHud(){document.getElementById('life').textContent='♥ '.repeat(this.hp)+'  ·  ✦ '+this.ammo;if(this.ammoText)this.ammoText.setText('✦ '+this.ammo);if(this.weaponText)this.updateWeaponHud()}
 updateWeaponHud(){if(this.weaponText){const w=this.weapons[this.weaponIndex];this.weaponText.setText(w.symbol+' '+w.name+(w.id==='rifle'?' · '+this.ammo+' BALAS':'')+(w.id==='machete'&&this.blessingLevel?' · BENDICIÓN '+this.blessingLevel:'')+(this.combatReady?' · ALERTA':''));}}
 cycleWeapon(){for(let i=0;i<this.weapons.length;i++){this.weaponIndex=(this.weaponIndex+1)%this.weapons.length;if(this.weapons[this.weaponIndex].id!=='rifle'||this.ammo>0)break;}this.updateWeaponHud();document.getElementById('hint').innerHTML='Arma equipada: '+this.weapons[this.weaponIndex].name;}
 grantBlessing(){this.blessingLevel=Math.min(3,this.blessingLevel+1);this.macheteDamageBonus=this.blessingLevel;this.updateWeaponHud();document.getElementById('hint').innerHTML='Bendición del monte: el machete ha ganado poder ('+this.blessingLevel+'/3).';}
 spawnAmbush(){const px=this.player.x;this.combatReady=true;if(this.ammo>0){this.weaponIndex=0;}else{this.weaponIndex=1;}this.updateWeaponHud();for(let i=0;i<2;i++){const x=px+(i===0?440:560);const e=this.physics.add.sprite(x,365+(i*18),'aoaoSprite').setDisplaySize(54,68).setTint(0xd6d1b0);e.body.setAllowGravity(false);e.setData('hp',3);e.setData('seedDirection',-1);e.setVelocityX(-45);this.physics.add.overlap(this.player,e,()=>this.touchEnemy(e));this.enemies.push(e);}this.ambushActive=2600;document.getElementById('hint').innerHTML='¡EMBOSCADA! El perro ha detectado algo. Prepárate.';}
 touchEnemy(e){if(!e.active||this.player.y>e.y+65)return;if(this.hitWait<=0){this.hp=Math.max(0,this.hp-1);this.hitWait=900;this.updateHud();if(!this.hp){this.physics.pause();this.gameOver=true;document.getElementById('controls').style.display='none';document.getElementById('hint').style.display='none';document.getElementById('gameover').style.display='flex';}}}
 shoot(){if(this.shotWait>0)return;if(this.ammo<=0){this.weaponIndex=1;this.updateWeaponHud();document.getElementById('hint').innerHTML='Sin munición. ¡Sigue con el machete!';return;}this.shotWait=260;this.ammo--;let dir=this.player.flipX?-1:1;let b=this.physics.add.image(this.player.x+dir*30,this.player.y+3,'bullet');b.setVelocityX(dir*540);b.body.setAllowGravity(false);this.physics.add.overlap(b,this.enemies,(shot,e)=>{if(!e.active)return;e.setData('hp',e.getData('hp')-1);shot.destroy();if(e.getData('hp')<=0){let x=e.x,y=e.y;this.dropDogItem(x,y);e.destroy();if(Math.random()<.42){let drop=this.physics.add.staticImage(x,y,'bullet').setTint(0xe8c65a);drop.setScale(1.5).refreshBody();this.physics.add.overlap(this.player,drop,()=>{if(drop.active){this.ammo+=6;drop.destroy();this.updateHud()}})}}});if(this.boss&&this.boss.active)this.physics.add.overlap(b,this.boss,()=>{if(b.active&&this.boss.active){b.destroy();this.bossHp--;if(this.bossHp<=0){this.boss.destroy();document.getElementById('hint').innerHTML='¡Jefe derrotado! Has completado la primera fase.'}}});this.time.delayedCall(1800,()=>{if(b.active)b.destroy()});this.projectiles.push(b);this.updateHud()}
 spawnBoss(){this.bossSpawned=true;this.bossHp=12;this.boss=this.physics.add.sprite(this.levelLength-650,365,'boss').setImmovable(true);this.boss.body.setAllowGravity(false);this.physics.add.overlap(this.player,this.boss,()=>this.touchEnemy(this.boss));document.getElementById('hint').innerHTML='¡EL AO AO MAYOR! Dispara para derrotarlo.'}
 dropDogItem(x,y){const item=this.add.text(x,y,'🦴',{fontSize:'23px'}).setOrigin(.5).setDepth(20);item.kind='bone';this.dogItems.push(item);}
 meleeAttack(){if(this.weaponCooldown>0||this.swingTime>0)return;const w=this.weapons[this.weaponIndex];if(w.id==='rifle'){this.shoot();return;}this.weaponCooldown=w.id==='machete'?620:w.id==='rebenque'?500:420;this.swingTime=w.id==='machete'?390:w.id==='rebenque'?320:270;this.swingKind=w.id;this.swingProgress=0;this.player.setData('swingFacing',this.player.flipX?-1:1);const reach=w.id==='machete'?100:w.id==='rebenque'?138:52;const damage=(w.id==='machete'?3:w.id==='rebenque'?1:1)+(w.id==='machete'?this.macheteDamageBonus:0);for(const e of this.enemies){if(!e.active)continue;const dx=(e.x-this.player.x)*(this.player.flipX?-1:1);if(dx> -18&&dx<reach&&Math.abs(e.y-this.player.y)<88){e.setData('hp',e.getData('hp')-damage);e.setVelocityX((this.player.flipX?-1:1)*(w.id==='rebenque'?240:150));if(e.getData('hp')<=0){this.dropDogItem(e.x,e.y);e.destroy();}}}if(this.boss&&this.boss.active&&Math.abs(this.boss.x-this.player.x)<reach+35){this.bossHp=Math.max(0,this.bossHp-damage);if(this.bossHp<=0){this.boss.destroy();document.getElementById('hint').innerHTML='¡El Ao Ao mayor ha caído!';}}}
 updateDog(dt){this.dogThink-=dt;this.dogAttackWait=Math.max(0,this.dogAttackWait-dt);const p=this.player;let threat=null,dist=9999;for(const e of this.enemies){if(e.active){const d=Phaser.Math.Distance.Between(p.x,p.y,e.x,e.y);if(d<dist){dist=d;threat=e;}}}if(this.dogThink<=0){this.dogThink=180;if(threat&&dist<280){this.dogState=dist<125?'GUARD':'ALERT';if(!this.combatReady){this.combatReady=true;document.getElementById('hint').innerHTML='¡El perro ha detectado una amenaza! Arma preparada: tú decides cuándo atacar.';this.updateWeaponHud();}}else if(Math.abs(p.x-this.lastPlayerX)<2){this.dogIdle+=180;this.dogState=this.dogIdle>6500?'SNIFF':'FOLLOW';}else{this.dogIdle=0;this.dogState='FOLLOW';}this.lastPlayerX=p.x;if(!threat||dist>=320){if(this.combatReady){this.combatReady=false;document.getElementById('hint').innerHTML='El camino vuelve a estar tranquilo.';}}}
  let tx=p.x-(p.flipX?-1:1)*42,ty=p.y+31+Math.sin(this.time.now/180)*2;if((this.dogState==='ALERT'||this.dogState==='GUARD')&&threat){tx=p.x+(threat.x<p.x? -25:25);ty=p.y+30;if(this.dogAttackWait<=0&&dist<78){this.dogAttackWait=1150;threat.setVelocityX(threat.x<p.x?-190:190);threat.setData('hp',threat.getData('hp')-1);if(threat.getData('hp')<=0){this.dropDogItem(threat.x,threat.y);threat.destroy();}}}
  if(this.dogState==='SNIFF'){const candidate=this.dogItems.find(it=>it.active&&Phaser.Math.Distance.Between(this.dog.x,this.dog.y,it.x,it.y)<170);if(candidate){this.dogState='FETCH';this.dogTarget=candidate;}else if(this.dogIdle>10500){this.dogState='DIG';this.dogIdle=0;}}
  if(this.dogState==='FETCH'&&this.dogTarget&&this.dogTarget.active){tx=this.dogTarget.x;ty=this.dogTarget.y; if(Math.abs(this.dog.x-tx)<18){this.dogTarget.destroy();this.dogTarget=null;this.dogState='RETURN';}}else if(this.dogState==='FETCH'&&!this.dogTarget)this.dogState='RETURN';
  if(this.dogState==='DIG'){this.dog.rotation=Math.sin(this.time.now/70)*.12;this.dogIdle+=dt;if(this.dogIdle>1700){this.dogState='FOLLOW';this.dogIdle=0;}}
  if(this.dogState==='RETURN')this.dogState='FOLLOW';this.dog.x=Phaser.Math.Linear(this.dog.x,tx,Math.min(1,dt/180));this.dog.y=Phaser.Math.Linear(this.dog.y,ty,Math.min(1,dt/180));this.dog.setDepth(this.dog.y);this.dogSignal.setPosition(this.dog.x-8,this.dog.y-48);this.dogSignal.setText(this.dogState==='ALERT'?'!':this.dogState==='GUARD'?'!!':this.dogState==='DIG'?'…':this.dogState==='SNIFF'?'⌕':'');this.dog.rotation=this.dogState==='GUARD'?Math.sin(this.time.now/65)*.08:0;
 }
 update(t,dt){
  if(!this.player.active)return;this.elapsed+=dt;this.shotWait=Math.max(0,this.shotWait-dt);this.hitWait=Math.max(0,this.hitWait-dt);this.weaponCooldown=Math.max(0,this.weaponCooldown-dt);
  const p=this.player,pad=readGamepad(),left=keys.left||pad.left||this.cursors.left.isDown||this.wasd.A.isDown,right=keys.right||pad.right||this.cursors.right.isDown||this.wasd.D.isDown,jump=keys.jump||pad.jump||this.cursors.up.isDown||this.wasd.W.isDown||this.wasd.SPACE.isDown,fire=keys.attack||pad.attack||this.wasd.J.isDown||this.wasd.K.isDown;
  p.setVelocityX(left?-190:right?190:0);p.setFlipX(left);if(this.swingTime<=0){const moving=left||right;p.setRotation(moving?Math.sin(t*.024)*.035:Math.sin(t*.003)*.005);p.setScale(this.playerBaseScaleX,this.playerBaseScaleY*(1+(moving?Math.abs(Math.sin(t*.024))*.018:Math.sin(t*.004)*.006)));}if(jump&&p.body.blocked.down)p.setVelocityY(-440);const weaponDown=keys.weapon||this.wasd.L.isDown;if(weaponDown&&!this.weaponWasDown)this.cycleWeapon();this.weaponWasDown=weaponDown;if(fire){if(this.weapons[this.weaponIndex].id==='rifle')this.shoot();else this.meleeAttack();}if(this.swingTime>0){this.swingTime=Math.max(0,this.swingTime-dt);const dir=p.getData('swingFacing')||1;const total=this.swingKind==='machete'?390:this.swingKind==='rebenque'?320:270;const progress=1-this.swingTime/total;const windup=progress<.28;const strike=progress>=.28&&progress<.78;const recover=progress>=.78;p.setRotation(dir*(windup?-.22: strike?(.48*Math.sin((progress-.28)/.5*Math.PI)):.12*(1-progress)));this.weaponFx.clear();this.weaponFx.lineStyle(this.swingKind==='rebenque'?5:8,this.swingKind==='machete'?0xd9d6c4:0x9c7548,strike?.95:.35);this.weaponFx.beginPath();const start=dir===1?-1.25:Math.PI-1.25;const end=dir===1?1.05:Math.PI+1.05;const radius=this.swingKind==='machete'?68:this.swingKind==='rebenque'?100:42;for(let i=0;i<=18;i++){const u=i/18;const a=start+(end-start)*u;const wobble=Math.sin(u*Math.PI)*8;const x=p.x+dir*18+Math.cos(a)*(radius+wobble);const y=p.y-9+Math.sin(a)*(radius+wobble);if(i===0)this.weaponFx.moveTo(x,y);else this.weaponFx.lineTo(x,y);}this.weaponFx.strokePath();}else{p.setRotation(0);this.weaponFx.clear();}this.updateDog(dt);
  while(this.nextSpawnX<p.x+1450&&this.nextSpawnX<this.levelLength-1200){this.spawnWorldSegment(this.nextSpawnX);this.nextSpawnX+=560;}
  for(const e of this.enemies){if(e.active){if(Math.abs(e.x-p.x)<420){e.setVelocityX(e.x<p.x?58:-58)}else{e.setVelocityX(28*e.getData('seedDirection'))}}}
  const sec=Math.min(200,Math.floor(this.elapsed/1000)),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');this.timerText.setText('FASE: '+m+':'+s+' / 03:20');
  if(this.ambushIndex<this.ambushMarks.length&&p.x>this.ambushMarks[this.ambushIndex]){this.spawnAmbush();this.ambushIndex++;}if(this.ambushActive>0)this.ambushActive-=dt;
  if(!this.bossSpawned&&this.elapsed>=200000)this.spawnBoss();
  if(p.x>this.levelLength-450&&!this.bossSpawned)this.spawnBoss();
  if(this.bossSpawned&&this.boss&&this.boss.active)this.boss.x=Math.max(this.levelLength-1000,this.boss.x-35*dt/1000);
  if(p.x>=this.levelLength-120&&this.boss&&!this.boss.active&&!this.levelComplete){this.levelComplete=true;document.getElementById('hint').style.display='none';document.getElementById('controls').style.display='none';document.getElementById('levelcomplete').style.display='flex';this.physics.pause();}
 }
}
const config={type:Phaser.AUTO,parent:'game',width:960,height:540,backgroundColor:'#080b09',pixelArt:false,physics:{default:'arcade',arcade:{gravity:{y:900},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Intro,Forest]};
