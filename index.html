<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101812"><title>Cazador: Mitos del Paraguay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;color:#f4e8c8;font-family:system-ui,sans-serif;touch-action:none}
#game{width:100%;height:100%;display:grid;place-items:center}canvas{max-width:100%;max-height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:12px 14px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #101010;font-weight:800;letter-spacing:.04em}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:#101812cc;border:1px solid #b58b50;padding:9px 14px;border-radius:8px;text-align:center;font-size:13px}
#controls{position:fixed;inset:auto 0 18px;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.ctrl{width:62px;height:62px;border:2px solid #d7bd82;border-radius:16px;background:#26382cdd;color:#fff1c8;font-size:25px;font-weight:900;box-shadow:0 4px #101010;touch-action:none;user-select:none}
.ctrl:active{transform:translateY(3px);box-shadow:0 1px #101010;background:#526343}
@media(min-width:800px){#controls{opacity:.65}.ctrl{width:54px;height:54px}}
</style>
</head>
<body><div id="game"></div><div id="hud"><span>CAZADOR · MITOS DEL PARAGUAY</span><span id="life">♥ ♥ ♥</span></div><div id="hint">Bosque del Yvyrá · Nivel 1<br>Encuentra y ahuyenta al espíritu del monte</div>
<div id="controls"><div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="pad"><button class="ctrl" data-key="jump">⬆</button><button class="ctrl" data-key="attack">✦</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="./intro.js"></script>
<script>
const keys={left:false,right:false,jump:false,attack:false};
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));});
class Forest extends Phaser.Scene{
 constructor(){super('forest');this.hp=3;this.hitWait=0;this.shotWait=0;this.elapsed=0;this.levelLength=38000;this.bossSpawned=false;this.projectiles=[];this.enemies=[];this.loot=[]}
 create(){
  document.getElementById('hud').style.display='flex';document.getElementById('controls').style.display='flex';document.getElementById('hint').style.display='block';
  this.physics.world.setBounds(0,0,this.levelLength,540);
  const bg=this.add.graphics();bg.fillGradientStyle(0x101b16,0x101b16,0x33402a,0x33402a,1);bg.fillRect(0,0,this.levelLength,540);
  for(let x=0;x<this.levelLength;x+=380){let h=150+(Math.sin(x*.017)*45);bg.fillStyle(0x203326,1);bg.fillTriangle(x,425,x+90,425-h,x+180,425);bg.fillTriangle(x+150,425,x+245,425-h*.8,x+340,425);bg.fillStyle(0x18271e,1);bg.fillRect(x+80,300,22,130);bg.fillRect(x+275,325,18,105)}
  bg.fillStyle(0x59452b,1);bg.fillRect(0,445,this.levelLength,95);bg.fillStyle(0x819052,1);for(let x=0;x<this.levelLength;x+=32)bg.fillRect(x,442+(x%3),18,4);
  // Texturas propias: suelo, protagonista, espíritu, bala y jefe.
  let g=this.make.graphics({x:0,y:0,add:false});g.fillStyle(0x59452b,1);g.fillRect(0,0,64,32);g.fillStyle(0x819052,1);g.fillRect(0,0,64,5);g.generateTexture('groundTile',64,32);g.destroy();
  this.makeHunter();this.makeGhost();
  this.ground=this.physics.add.staticGroup();for(let x=0;x<this.levelLength;x+=64)this.ground.create(x+32,462,'groundTile').refreshBody();
  this.player=this.physics.add.sprite(150,370,'hunter').setCollideWorldBounds(true);this.player.body.setSize(28,54).setOffset(10,5);
  this.physics.add.collider(this.player,this.ground);
  this.dog=this.add.container(112,405);this.drawDog(this.dog);
  this.cameras.main.setBounds(0,0,this.levelLength,540);this.cameras.main.startFollow(this.player,true,.08,.08);
  this.cursors=this.input.keyboard.createCursorKeys();this.wasd=this.input.keyboard.addKeys('A,D,W,SPACE,J,K');
  // Generación determinista por tramos: plataformas, Ao Ao y suministros.
  let seed=20261122;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  for(let x=650;x<this.levelLength-1200;x+=560){
   if(rnd()>.28){let y=350+Math.floor(rnd()*55);let e=this.physics.add.sprite(x,y,'ghost').setTint(0xb8c9ae);e.body.setAllowGravity(false);e.setData('hp',2);this.physics.add.overlap(this.player,e,()=>this.touchEnemy(e));this.enemies.push(e)}
   if(rnd()>.55){let a=this.physics.add.staticImage(x+220,405,'groundTile');a.setScale(1.8,.35).refreshBody();this.physics.add.collider(this.player,a)}
   if(rnd()>.52){let item=this.physics.add.staticImage(x+300,405,'groundTile').setTint(0xe8c65a);item.setScale(.35,.35).refreshBody();item.setData('ammo',5);this.physics.add.overlap(this.player,item,()=>{if(item.active){this.ammo+=5;item.destroy();this.updateHud()}});this.loot.push(item)}
  }
  this.ammo=24;this.updateHud();
  this.add.text(24,495,'A/D O FLECHAS: MOVER · ESPACIO: SALTAR · J: DISPARAR',{fontFamily:'monospace',fontSize:'13px',color:'#f4e8c8'}).setScrollFactor(0).setAlpha(.9);
  this.timerText=this.add.text(480,18,'FASE: 00:00 / 03:20',{fontFamily:'monospace',fontSize:'15px',color:'#f4e8c8'}).setOrigin(.5,0).setScrollFactor(0);
  this.add.text(800,18,'MUNICIÓN',{fontFamily:'monospace',fontSize:'12px',color:'#f4e8c8'}).setScrollFactor(0);
 }
 drawDog(c){let a=this.add.graphics();a.fillStyle(0x9b7045,1);a.fillEllipse(0,0,40,22);a.fillCircle(13,-11,11);a.fillStyle(0x3b2b20,1);a.fillTriangle(7,-18,11,-31,17,-18);a.fillCircle(17,-12,2);a.fillStyle(0xf1dfba,1);a.fillEllipse(18,-7,9,6);c.add(a)}
 makeHunter(){let g=this.add.graphics();g.fillStyle(0x30251d,1);g.fillRect(12,37,13,23);g.fillRect(28,37,13,23);g.fillStyle(0x4b3426,1);g.fillRect(8,57,20,6);g.fillRect(27,57,20,6);g.fillStyle(0xd9c69b,1);g.fillRect(10,12,33,34);g.fillStyle(0x9e2930,1);g.fillRect(11,12,31,7);g.fillStyle(0x8a6039,1);g.fillRect(10,0,34,8);g.fillRect(4,7,47,5);g.fillStyle(0xd6aa76,1);g.fillRect(20,20,15,14);g.fillStyle(0x30251d,1);g.fillRect(31,25,3,3);g.generateTexture('hunter',56,66);g.destroy();let gh=this.add.graphics();gh.fillStyle(0xc4d4bc,.9);gh.fillEllipse(26,28,42,52);gh.fillStyle(0x1b2923,1);gh.fillCircle(19,24,4);gh.fillCircle(32,24,4);gh.fillStyle(0x9e2930,1);gh.fillEllipse(26,42,15,5);gh.generateTexture('ghost',54,65);gh.destroy();let b=this.make.graphics({x:0,y:0,add:false});b.fillStyle(0xffd36b,1);b.fillRect(0,0,12,5);b.generateTexture('bullet',12,5);b.destroy();let boss=this.make.graphics({x:0,y:0,add:false});boss.fillStyle(0x24251d,1);boss.fillEllipse(55,55,100,100);boss.fillStyle(0xe7c66b,1);boss.fillCircle(38,45,7);boss.fillCircle(70,45,7);boss.fillStyle(0x8b2525,1);boss.fillEllipse(55,76,38,12);boss.generateTexture('boss',110,110);boss.destroy()}
 makeGhost(){}
 updateHud(){document.getElementById('life').textContent='♥ '.repeat(this.hp)+'  ·  ✦ '+this.ammo}
 touchEnemy(e){if(!e.active||this.player.y>e.y+65)return;if(this.hitWait<=0){this.hp=Math.max(0,this.hp-1);this.hitWait=900;this.updateHud();if(!this.hp){document.getElementById('hint').innerHTML='Has caído en el monte. Toca para reiniciar.';this.physics.pause();this.input.once('pointerdown',()=>this.scene.restart())}}}
 shoot(){if(this.shotWait>0||this.ammo<=0)return;this.shotWait=260;this.ammo--;let dir=this.player.flipX?-1:1;let b=this.physics.add.image(this.player.x+dir*30,this.player.y+3,'bullet');b.setVelocityX(dir*540);b.body.setAllowGravity(false);this.physics.add.overlap(b,this.enemies,(shot,e)=>{if(!e.active)return;e.setData('hp',e.getData('hp')-1);shot.destroy();if(e.getData('hp')<=0){let x=e.x,y=e.y;e.destroy();if(Math.random()<.42){let drop=this.physics.add.staticImage(x,y,'bullet').setTint(0xe8c65a);drop.setScale(1.5).refreshBody();this.physics.add.overlap(this.player,drop,()=>{if(drop.active){this.ammo+=6;drop.destroy();this.updateHud()}})}}});if(this.boss&&this.boss.active)this.physics.add.overlap(b,this.boss,()=>{if(b.active&&this.boss.active){b.destroy();this.bossHp--;if(this.bossHp<=0){this.boss.destroy();document.getElementById('hint').innerHTML='¡Jefe derrotado! Has completado la primera fase.'}}});this.time.delayedCall(1800,()=>{if(b.active)b.destroy()});this.projectiles.push(b);this.updateHud()}
 spawnBoss(){this.bossSpawned=true;this.bossHp=12;this.boss=this.physics.add.sprite(this.levelLength-650,365,'boss').setImmovable(true);this.boss.body.setAllowGravity(false);this.physics.add.overlap(this.player,this.boss,()=>this.touchEnemy(this.boss));document.getElementById('hint').innerHTML='¡EL AO AO MAYOR! Dispara para derrotarlo.'}
 update(t,dt){
  if(!this.player.active)return;this.elapsed+=dt;this.shotWait=Math.max(0,this.shotWait-dt);this.hitWait=Math.max(0,this.hitWait-dt);
  const p=this.player,left=keys.left||this.cursors.left.isDown||this.wasd.A.isDown,right=keys.right||this.cursors.right.isDown,jump=keys.jump||this.cursors.up.isDown||this.wasd.W.isDown||this.wasd.SPACE.isDown,fire=keys.attack||this.wasd.J.isDown||this.wasd.K.isDown;
  p.setVelocityX(left?-190:right?190:0);p.setFlipX(left);if(jump&&p.body.blocked.down)p.setVelocityY(-440);if(fire)this.shoot();
  this.dog.setPosition(p.x-38,p.y+29);this.dog.setDepth(p.y);
  const sec=Math.min(200,Math.floor(this.elapsed/1000)),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');this.timerText.setText('FASE: '+m+':'+s+' / 03:20');
  if(!this.bossSpawned&&this.elapsed>=200000)this.spawnBoss();
  if(p.x>this.levelLength-450&&!this.bossSpawned)this.spawnBoss();
  if(this.bossSpawned&&this.boss&&this.boss.active)this.boss.x=Math.max(this.levelLength-1000,this.boss.x-35*dt/1000);
  if(p.x>=this.levelLength-120&&this.boss&&!this.boss.active){document.getElementById('hint').innerHTML='¡Nivel 1 completado!';}
 }
}
const config={type:Phaser.AUTO,parent:'game',width:960,height:540,backgroundColor:'#080b09',pixelArt:true,physics:{default:'arcade',arcade:{gravity:{y:900},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Intro,Forest]};
new Phaser.Game(config);
</script></body></html>
